openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Travel Planner API (India Edition)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: travel
    description: Travel planning operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /travel/plan:
    post:
      operationId: generateTravelPlan
      tags: [travel]
      summary: Generate a full travel plan (India only)
      description: Uses multi-agent AI to generate itinerary, transport options, and hotel recommendations for Indian destinations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelPlanRequest"
      responses:
        "200":
          description: Travel plan generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelPlanResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /travel/saved:
    get:
      operationId: getSavedTrips
      tags: [travel]
      summary: Get all saved trips
      responses:
        "200":
          description: List of saved trips
          content:
            application/json:
              schema:
                type: object
                properties:
                  trips:
                    type: array
                    items:
                      $ref: "#/components/schemas/SavedTrip"
                required:
                  - trips

    post:
      operationId: saveTrip
      tags: [travel]
      summary: Save a travel plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveTripRequest"
      responses:
        "201":
          description: Trip saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedTrip"

  /travel/saved/{id}:
    delete:
      operationId: deleteTrip
      tags: [travel]
      summary: Delete a saved trip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trip deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — Bearer <sid>.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    TravelPlanRequest:
      type: object
      properties:
        destination:
          type: string
          description: Indian city destination
        budget:
          type: number
          description: Total budget in INR (₹)
        startDate:
          type: string
          description: Start date (YYYY-MM-DD)
        endDate:
          type: string
          description: End date (YYYY-MM-DD)
        travelers:
          type: integer
          description: Number of travelers
          minimum: 1
        preferences:
          type: array
          items:
            type: string
          description: Travel preferences
        origin:
          type: string
          description: Origin Indian city for transport options
      required:
        - destination
        - budget
        - startDate
        - endDate
        - travelers
        - preferences

    ItineraryDay:
      type: object
      properties:
        day:
          type: integer
        date:
          type: string
        theme:
          type: string
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        estimatedCost:
          type: number
      required:
        - day
        - date
        - theme
        - activities
        - estimatedCost

    Activity:
      type: object
      properties:
        time:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
        estimatedCost:
          type: number
        location:
          type: string
      required:
        - time
        - name
        - description
        - type
        - estimatedCost
        - location

    TransportOption:
      type: object
      properties:
        id:
          type: string
        mode:
          type: string
          enum: [flight, train, bus, ferry]
        carrier:
          type: string
        departureTime:
          type: string
        arrivalTime:
          type: string
        duration:
          type: string
        price:
          type: number
        pricePerPerson:
          type: number
        class:
          type: string
        stops:
          type: integer
        isRecommended:
          type: boolean
        trainNumber:
          type: string
        filter:
          type: string
      required:
        - id
        - mode
        - carrier
        - departureTime
        - arrivalTime
        - duration
        - price
        - pricePerPerson
        - class
        - stops
        - isRecommended

    HotelOption:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        rating:
          type: number
        stars:
          type: integer
        pricePerNight:
          type: number
        totalPrice:
          type: number
        location:
          type: string
        imageUrl:
          type: string
        amenities:
          type: array
          items:
            type: string
        description:
          type: string
        isRecommended:
          type: boolean
        category:
          type: string
          enum: [budget, mid-range, luxury]
      required:
        - id
        - name
        - rating
        - stars
        - pricePerNight
        - totalPrice
        - location
        - imageUrl
        - amenities
        - description
        - isRecommended
        - category

    OptimizationSummary:
      type: object
      properties:
        decisions:
          type: array
          items:
            type: string
        savings:
          type: number
        budgetStatus:
          type: string
          enum: [within, exceeded, optimized]
      required:
        - decisions
        - savings
        - budgetStatus

    TravelPlanResponse:
      type: object
      properties:
        itinerary:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryDay"
        transport:
          type: array
          items:
            $ref: "#/components/schemas/TransportOption"
        hotels:
          type: array
          items:
            $ref: "#/components/schemas/HotelOption"
        totalEstimatedCost:
          type: number
        budgetStatus:
          type: string
          enum: [within, exceeded, optimized]
        optimization:
          $ref: "#/components/schemas/OptimizationSummary"
        destination:
          type: string
        imageUrl:
          type: string
        currency:
          type: string
      required:
        - itinerary
        - transport
        - hotels
        - totalEstimatedCost
        - budgetStatus
        - optimization
        - destination
        - imageUrl

    SaveTripRequest:
      type: object
      properties:
        name:
          type: string
        plan:
          $ref: "#/components/schemas/TravelPlanResponse"
        request:
          $ref: "#/components/schemas/TravelPlanRequest"
      required:
        - name
        - plan
        - request

    SavedTrip:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        destination:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        budget:
          type: number
        totalCost:
          type: number
        budgetStatus:
          type: string
        plan:
          $ref: "#/components/schemas/TravelPlanResponse"
        request:
          $ref: "#/components/schemas/TravelPlanRequest"
        createdAt:
          type: string
      required:
        - id
        - name
        - destination
        - startDate
        - endDate
        - budget
        - totalCost
        - budgetStatus
        - plan
        - request
        - createdAt
